<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Total Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 2rem;
        color: #1f2937;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        padding: 1.5rem;
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
        font-weight: bold;
      }

      input {
        padding: 0.7rem;
        font-size: 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }

      button {
        padding: 0.8rem;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }

      .bill-list,
      .category-section {
        margin-top: 1rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 0.7rem;
        text-align: left;
      }

      th {
        background: #f8fafc;
      }

      .category-box {
        padding: 0.75rem;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        background: #fff;
      }

      .category-box h3 {
        margin: 0 0 0.5rem;
      }

      .delete-btn {
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        cursor: pointer;
      }

      .category {
        font-weight: bold;
        color: #0f766e;
      }

      .empty {
        color: #64748b;
        font-style: italic;
      }

      .footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.95rem;
        color: #475569;
        border-top: 1px solid #e2e8f0;
        padding-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cart Total Calculator</h1>
      <form id="cart-form">
        <label>
          Item Name
          <input id="item-name" type="text" placeholder="Enter item name" required />
        </label>
        <label>
          Item Cost
          <input id="item-cost" type="number" min="0" step="0.01" placeholder="Enter cost" required />
        </label>
        <label>
          Number of Items
          <input id="item-quantity" type="number" min="1" step="1" placeholder="Enter quantity" required />
        </label>
        <button type="submit">Calculate</button>
      </form>

      <div class="bill-list">
        <h3>Bill Items</h3>
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Cost</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bill-items"></tbody>
        </table>
      </div>

      <div class="category-section">
        <div class="category-box">
          <h3>Cheap Items</h3>
          <div id="cheap-items"></div>
        </div>
        <div class="category-box">
          <h3>Expensive Items</h3>
          <div id="expensive-items"></div>
        </div>
      </div>
    </div>

    <div class="footer">Sharadvardhan Acharya<br />24070521027</div>

    <script src="script.js"></script>
  </body>
</html>
