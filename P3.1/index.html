<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIT Student Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="login-panel">
      <h1>SIT Student Login</h1>
      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="loginId">Login ID (Name):</label>
          <input type="text" id="loginId" name="loginId" placeholder="Enter your login ID" required />
          <p class="error" id="loginIdError">Login ID must be at least 3 characters.</p>
        </div>

        <div class="field-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
          <p class="error" id="passwordError">Password must contain: at least 8 characters, one uppercase letter, one integer, one special character.</p>
        </div>

        <button type="submit" class="login-button">Login</button>
      </form>
    </section>
    <div class="footer-text">
      <span>J Sharadvardhan Acharya</span>
      <span>24070521027</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
