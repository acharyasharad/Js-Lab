<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Deck Demo</title>
  <link rel="stylesheet" href="deck-style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">Electronics Deck</div>
      <div><a href="index.html">Back to ShopZone</a></div>
    </div>

    <div class="layout">
      <div class="products-panel">
        <h3>Products</h3>
        <div id="productsList"></div>
      </div>

      <aside class="sidebar">
        <h3>Bill Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
        <div class="summary-row"><span>GST (18%)</span><span id="gst">₹0</span></div>
        <div class="summary-row total"><span>Total</span><span id="grandTotal">₹0</span></div>
        <button class="calc-btn" id="calcBtn">Calculate Bill</button>
        <div class="note">Enter quantities for any products, then calculate your bill.</div>
        <a class="footer-link" href="bill.html">Open printable bill</a>
      </aside>
    </div>
  </div>

  <script src="deck-script.js"></script>
</body>
</html>
