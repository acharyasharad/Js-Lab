<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>String Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>String Tools</h1>

    <section class="card">
      <h2>Reverse a String</h2>
      <div class="row">
        <input id="reverseInput" placeholder="Enter text to reverse" />
        <button id="reverseBtn">Reverse</button>
      </div>
      <div id="reverseOutput" class="output" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>Count Vowels in Paragraph</h2>
      <textarea id="paragraph" rows="6" placeholder="Paste or type a paragraph here..."></textarea>
      <div class="row">
        <button id="countBtn">Count Vowels</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
      <div id="vowelOutput" class="output" aria-live="polite"></div>
    </section>

    <footer>
      <small>akshat digalwar 24070521003</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
